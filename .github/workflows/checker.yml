name: Auto Key Checker

on:
  schedule:
    - cron: '0 */4 * * *'  # Каждые 4 часа
  workflow_dispatch:       # Кнопка запуска

permissions:
  contents: write

jobs:
  check-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # Лимит 6 часов, чтобы не отрубило раньше
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Checker Script
        run: |
          echo "🚀 Starting VPN key checker..."
          python main.py
          echo "✅ Checker script completed"

      - name: Check for Changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected in checked files"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📝 No changes detected"
          fi

      - name: Commit & Push Results
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update checked keys $(date '+%Y-%m-%d %H:%M:%S')"
          file_pattern: "checked/*"
          push_options: --force

      - name: Summary
        run: |
          if [ "${{ steps.verify-changed-files.outputs.changed }}" == "true" ]; then
            echo "✅ Successfully updated and committed VPN keys"
          else
            echo "ℹ️ No updates needed - all keys are up to date"
          fi
