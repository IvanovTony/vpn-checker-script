name: Command Checker

on:
  push:
    branches: [ main, master ]
    paths: 
      - 'command_checker.py'
      - 'requirements.txt'
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # Каждую минуту для быстрого реагирования

jobs:
  command-checker:
    runs-on: ubuntu-latest
    # Используем continuous deployment для постоянной работы
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Command Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        timeout-minutes: 5  # Короткий запуск для проверки
        run: |
          echo "🔍 Запуск системы проверки команд..."
          echo "⏰ Время: $(date '+%H:%M:%S UTC')"
          echo "🤖 Бот: $REPO_OWNER/$REPO_NAME"
          
          # Запускаем проверку на 4 минуты
          timeout 240s python3 command_checker.py || echo "Проверка завершена по таймауту"
          
          echo "📊 Система проверки команд работает!"
          echo "🔄 Следующая проверка через 1 минуту"

      - name: Status Update
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="✅ Система проверки команд активна\n🔍 Проверка каждую минуту\n🚀 Бот запускается автоматически"
          else
            MESSAGE="⚠️ Система проверки команд требует внимания\n📝 Проверьте логи в GitHub Actions"
          fi
          
          python3 -c "
          import requests
          import os
          
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('CHAT_ID')
          message = os.getenv('MESSAGE')
          
          if token and chat_id:
              url = f'https://api.telegram.org/bot{token}/sendMessage'
              data = {
                  'chat_id': chat_id,
                  'text': message,
                  'parse_mode': 'Markdown'
              }
              response = requests.post(url, json=data)
              print(f'Status update: {response.status_code}')
          "
