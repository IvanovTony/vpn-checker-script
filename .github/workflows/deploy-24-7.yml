name: Build and Test 24/7 Bot

on:
  push:
    branches: [ main, master ]
    paths: 
      - 'telegram_bot.py'
      - 'run_bot.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
  workflow_dispatch:
    inputs:
      redeploy:
        description: 'Force rebuild'
        required: false
        default: false

jobs:
  test-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Bot Configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "🧪 Testing 24/7 bot configuration..."
          
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "✅ TELEGRAM_BOT_TOKEN found in GitHub Secrets"
            # Тестируем инициализацию бота
            python3 -c "
          import os
          import sys
          from telegram_bot import VPNBot
          
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          print('🤖 Testing bot initialization...')
          
          try:
              bot = VPNBot(token)
              print('✅ Bot successfully initialized')
              
              # Проверяем доступ к файлам
              ru_keys = bot.get_all_keys_from_folder('checked/RU_Best', 'ru_white')
              euro_keys = bot.get_all_keys_from_folder('checked/My_Euro', 'my_euro')
              
              print(f'📊 Russia keys available: {len(ru_keys)}')
              print(f'📊 Europe keys available: {len(euro_keys)}')
              print(f'📊 Total keys: {len(ru_keys) + len(euro_keys)}')
              
              print('✅ All bot features working correctly!')
              print('📱 Commands: /start, /help, /ru, /all, /vless, /fast, /random, /status')
                  
          except Exception as e:
              print(f'❌ Bot test failed: {e}')
              sys.exit(1)
          "
          else
            echo "⚠️ No TELEGRAM_BOT_TOKEN - testing local functionality only"
            python3 -c "
          from telegram_bot import VPNBot
          print('🤖 Testing bot class structure...')
          try:
              # Проверяем структуру класса без токена
              import inspect
              methods = [method for method in dir(VPNBot) if not method.startswith('_')]
              print(f'✅ Bot class has {len(methods)} methods')
              print('✅ Bot structure is valid')
          except Exception as e:
              print(f'❌ Structure test failed: {e}')
          "
          fi

      - name: Test Docker Build
        run: |
          echo "🐳 Testing Docker build..."
          docker build -t vpn-bot-test .
          if [ $? -eq 0 ]; then
            echo "✅ Docker build successful"
            docker rmi vpn-bot-test
          else
            echo "❌ Docker build failed"
            exit 1
          fi

      - name: Update Status
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="🚀 **24/7 Bot Test Successful!**\n\n✅ Bot configuration is valid\n🐳 Docker build works\n📱 All commands ready\n📅 Tested: $(date '+%Y-%m-%d %H:%M:%S UTC')\n\n🔧 **Ready for 24/7 deployment!**"
          else
            MESSAGE="❌ **24/7 Bot Test Failed**\n\n⚠️ Check GitHub Actions logs\n🔧 Please fix configuration errors"
          fi
          
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            python3 -c "
          import requests
          import os
          
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('CHAT_ID')
          message = os.getenv('MESSAGE')
          
          if token and chat_id:
              url = f'https://api.telegram.org/bot{token}/sendMessage'
              data = {
                  'chat_id': chat_id,
                  'text': message,
                  'parse_mode': 'Markdown'
              }
              response = requests.post(url, json=data)
              print(f'Status update: {response.status_code}')
          "
          fi

      - name: Deployment Instructions
        if: always()
        run: |
          echo "🚀 24/7 Bot Deployment Guide"
          echo ""
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ SUCCESS: Bot is ready for 24/7 deployment!"
            echo ""
            echo "📋 **How to run 24/7 bot:**"
            echo ""
            echo "🏆 **Option 1 - Docker (Recommended):**"
            echo "1. Clone: git clone https://github.com/IvanovTony/vpn-checker-script.git"
            echo "2. Configure: cp .env.example .env && echo 'TELEGRAM_BOT_TOKEN=your_token' >> .env"
            echo "3. Run: docker-compose up -d"
            echo "4. Monitor: docker-compose logs -f vpn-bot"
            echo ""
            echo "🔧 **Option 2 - VPS/Server:**"
            echo "1. Clone repository"
            echo "2. Install: pip3 install -r requirements.txt"
            echo "3. Configure: cp .env.example .env"
            echo "4. Run with PM2: pm2 start run_bot.py --name vpn-bot"
            echo ""
            echo "📱 **Bot Features:**"
            echo "✅ Auto-restart every hour"
            echo "✅ Health checks every 60 seconds"
            echo "✅ Persistent storage for keys"
            echo "✅ All commands working 24/7"
            echo "✅ Automatic error recovery"
            echo "✅ Full logging and monitoring"
            echo ""
            echo "🎯 **Your bot is ready for 24/7 operation!**"
          else
            echo "❌ FAILED: Please check the test logs above"
          fi
