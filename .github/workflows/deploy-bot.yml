name: Deploy Telegram Bot

on:
  push:
    branches: [ main, master ]
    paths: 
      - 'telegram_bot.py'
      - 'run_bot.py'
      - 'requirements.txt'
      - '.env'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Environment File
        run: |
          if [ -f ".env" ]; then
            echo "✅ .env file found"
            # Check if required variables are set (but don't expose values)
            if grep -q "TELEGRAM_BOT_TOKEN=" .env && grep -q "CHAT_ID=" .env; then
              echo "✅ Required environment variables found in .env"
            else
              echo "⚠️ Some required variables might be missing in .env"
            fi
          else
            echo "⚠️ .env file not found - will use GitHub Secrets"
          fi

      - name: Test Bot Configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "🧪 Testing bot configuration..."
          
          # Check if token is available
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "✅ TELEGRAM_BOT_TOKEN found in GitHub Secrets"
            TOKEN_SOURCE="GitHub Secrets"
          elif [ -f ".env" ] && grep -q "TELEGRAM_BOT_TOKEN=" .env; then
            echo "✅ TELEGRAM_BOT_TOKEN found in .env file"
            TOKEN_SOURCE="local .env"
            # Load from .env for testing
            export $(grep -v '^#' .env | xargs)
          else
            echo "❌ TELEGRAM_BOT_TOKEN not found in GitHub Secrets or .env"
            echo "Please add TELEGRAM_BOT_TOKEN to GitHub Repository Secrets"
            exit 1
          fi
          
          echo "🔧 Testing bot initialization with token from $TOKEN_SOURCE..."
          python -c "
          import os
          import sys
          from telegram_bot import VPNBot
          
          try:
              token = os.getenv('TELEGRAM_BOT_TOKEN')
              if not token or token == 'your_bot_token_here':
                  print('❌ Invalid or placeholder token')
                  sys.exit(1)
              
              print('🤖 Initializing bot...')
              bot = VPNBot(token)
              print('✅ Bot successfully initialized')
              print('📋 Available commands:')
              print('  /start - Welcome message')
              print('  /help - Show help')
              print('  /ru - Russia keys')
              print('  /all - All keys')
              print('  /vless - Top 50 VLESS Russia keys')
              print('  /fast - Fastest VLESS Russia key')
              print('  /random - 5 random VLESS Russia keys')
              print('  /status - Keys status')
              print('✅ Bot configuration is valid!')
          except ImportError as e:
              print(f'❌ Import error: {e}')
              print('Please check if all dependencies are installed')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Bot initialization error: {e}')
              print('Please check your token and configuration')
              sys.exit(1)
          "

      - name: Test Bot Data Access
        run: |
          echo "🔍 Testing access to bot data files..."
          if [ -d "checked" ]; then
            echo "✅ checked directory exists"
            echo "📁 Files in checked/:"
            ls -la checked/ || echo "Directory exists but no files yet"
            
            if [ -d "checked/RU_Best" ]; then
              echo "✅ RU_Best directory exists"
              echo "📄 Russia files:"
              ls -la checked/RU_Best/ || echo "Directory exists but no files yet"
            fi
            
            if [ -d "checked/My_Euro" ]; then
              echo "✅ My_Euro directory exists"  
              echo "📄 Europe files:"
              ls -la checked/My_Euro/ || echo "Directory exists but no files yet"
            fi
          else
            echo "⚠️ checked directory not found - will be created by main.py"
          fi

      - name: Deploy Instructions
        run: |
          echo "🚀 Telegram Bot is ready for deployment!"
          echo ""
          echo "📋 Deployment options:"
          echo ""
          echo "🔧 Option 1 - GitHub Secrets (Recommended):"
          echo "1. Go to GitHub Repository Settings > Secrets and variables > Actions"
          echo "2. Add TELEGRAM_BOT_TOKEN (get from @BotFather)"
          echo "3. Add CHAT_ID (get from @userinfobot)"
          echo "4. Push changes to trigger this workflow"
          echo ""
          echo "🔧 Option 2 - Local .env file:"
          echo "1. Copy .env.example to .env"
          echo "2. Add your TELEGRAM_BOT_TOKEN and CHAT_ID"
          echo "3. Run locally: python3 run_bot.py"
          echo ""
          echo "📱 Bot Commands (set via @BotFather):"
          echo "start - 🎉 Start bot"
          echo "help - 📖 Show help"
          echo "ru - 🇷🇺 Get Russia keys"
          echo "all - 🌍 Get all keys"
          echo "vless - ⚡ Top 50 VLESS Russia keys"
          echo "fast - 🚀 Fastest VLESS Russia key"
          echo "random - 🎲 5 random VLESS Russia keys"
          echo "status - 📊 Keys status"
          echo ""
          echo "✅ Workflow completed successfully!"

      - name: Create Deployment Status Badge
        if: success()
        run: |
          echo "🎯 Deployment Status: SUCCESS"
          echo "📅 Date: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔧 Python Version: 3.11"
          echo "🤖 Bot Configuration: VALID"
