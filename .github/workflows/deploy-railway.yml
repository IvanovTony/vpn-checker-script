name: Deploy to Railway (24/7 Bot)

on:
  push:
    branches: [ main, master ]
    paths: 
      - 'telegram_bot.py'
      - 'webhook_bot.py'
      - 'requirements.txt'
      - 'Procfile'
      - 'runtime.txt'
      - '.env.example'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "🚀 Deploying to Railway..."
            railway login --token "$RAILWAY_TOKEN"
            railway up --service
            echo "✅ Deployed to Railway!"
            echo "📱 Your bot will be available 24/7 on Railway"
          else
            echo "⚠️ RAILWAY_TOKEN not found in GitHub Secrets"
            echo "📝 To deploy to Railway:"
            echo "1. Create account at https://railway.app"
            echo "2. Get Railway token from Railway dashboard"
            echo "3. Add RAILWAY_TOKEN to GitHub Repository Secrets"
            echo "4. Push changes to trigger deployment"
          fi

      - name: Setup Instructions
        if: always()
        run: |
          echo "🚀 Railway Deployment Instructions"
          echo ""
          echo "📋 **Manual Deployment (if automated failed):**"
          echo ""
          echo "1️⃣ **Create Railway Account:**"
          echo "   - Go to https://railway.app"
          echo "   - Sign up with GitHub (free)"
          echo ""
          echo "2️⃣ **Deploy Your Bot:**"
          echo "   - Click 'Deploy from GitHub repo'"
          echo "   - Select this repository"
          echo "   - Railway will auto-detect Python app"
          echo ""
          echo "3️⃣ **Configure Environment Variables:**"
          echo "   - Add TELEGRAM_BOT_TOKEN (get from @BotFather)"
          echo "   - Add WEBHOOK_URL (your Railway app URL + /webhook)"
          echo "   - Railway URL format: https://your-app-name.railway.app"
          echo ""
          echo "4️⃣ **Start the Service:**"
          echo "   - Railway will automatically deploy and run 24/7"
          echo "   - Your bot will be always online!"
          echo ""
          echo "🎯 **Benefits of Railway:**"
          echo "✅ FREE tier with 24/7 uptime"
          echo "✅ Automatic HTTPS (webhook ready)"
          echo "✅ Custom domain support"
          echo "✅ GitHub integration"
          echo "✅ Automatic deployments"
          echo "✅ Health monitoring"
          echo ""
          echo "📱 **Your Bot Commands (24/7 Available):**"
          echo "/start - Welcome message"
          echo "/help - Show help"
          echo "/ru - Russia keys"
          echo "/all - All keys"
          echo "/vless - Top 50 VLESS Russia keys"
          echo "/fast - Fastest VLESS Russia key"
          echo "/random - 5 random VLESS Russia keys"
          echo "/status - Keys status"
          echo ""
          echo "🔧 **Alternative FREE Services:**"
          echo "• Render.com (free tier)"
          echo "• Fly.io (free tier)"
          echo "• Koyeb.com (free tier)"
          echo "• Heroku (paid only now)"
          echo ""
          echo "💡 **Note:** Railway provides the best free 24/7 service for bots!"

      - name: Success Message
        if: success()
        run: |
          echo "✅ **Railway Deployment Successful!**"
          echo ""
          echo "🤖 Your VPN Bot is now running 24/7!"
          echo "📱 All commands available anytime"
          echo "🔗 HTTPS webhook configured automatically"
          echo "📊 Health monitoring active"
          echo ""
          echo "🎯 **Next Steps:**"
          echo "1. Get your Railway app URL"
          echo "2. Test your bot commands"
          echo "3. Enjoy 24/7 VPN bot service!"
