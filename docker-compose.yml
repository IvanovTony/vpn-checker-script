version: '3.8'

services:
  vpn-bot:
    build: .
    container_name: vpn-checker-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./checked:/app/checked
      - ./logs:/app/logs
    networks:
      - bot-network
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Опционально: nginx для мониторинга
  nginx:
    image: nginx:alpine
    container_name: vpn-bot-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
    networks:
      - bot-network
    depends_on:
      - vpn-bot
    profiles:
      - monitoring

networks:
  bot-network:
    driver: bridge
