version: '3.8'

services:
  vpn-bot:
    build: .
    container_name: vpn-checker-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./checked:/app/checked
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import telegram_bot; print('Bot OK')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
